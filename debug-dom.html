koyacak.9e:T4cd,talkinbio, sosyal medya bio sayfanızdaki ziyaretçilerle 7/24 sohbet eden bir yapay zeka asistanı (Saule) sunar. Platformu kullanımınız kapsamında iki ayrı veri grubu işlenir:\n\nİşletme sahibi (hesap sahibi) olarak sizin verileriniz:\n• Kimlik verileri: Ad, soyad\n• İletişim verileri: E-posta adresi\n• Hesap verileri: İşletme adı, kullanıcı adı (username), sektör/kategori\n• Kullanım ve ölçüm verileri: Giriş zamanları, platform içi eylemler, yapay zeka kullanım hacmi (kredi/token tüketimi)\n\nSayfanızı ziyaret eden kişilerin (son müşterilerinizin) verileri — bu veriler için siz veri sorumlususunuz, talkinbio veri işleyendir:\n• Saule ile yapılan konuşma transkriptleri (ziyaretçinin yazdığı mesajlar dahil)\n• Lead (potansiyel müşteri) bilgileri: ad, iletişim bilgisi, tercih edilen randevu zamanı\n• visitor_session_id adlı oturum çerezi (ziyaretçiyi kendi konuşma geçmişiyle eşlemek için)\n\nSaule bir yapay zeka asistanıdır; ziyaretçi doğrudan sorduğunda bu durum kendisine dürüstçe belirtilir. Bu konuşmalar hizmeti sağlayan işletme sahibi tarafından okunabilir ve yanıt üretme sürecinde bir yapay zeka sağlayıcısına iletilir (bkz. Madde 4)."])</script><script>self.__next_f.push([1,"94:[\"$\",\"$L9b\",null,{\"formats\":\"$undefined\",\"locale\":\"tr\",\"messages\":{\"Landing\":{\"nav\":{\"startFree\":\"Erken erişim\",\"login\":\"Giriş Yap\",\"stakeholders\":\"Paydaşlarımıza\",\"pricing\":\"Fiyatlandırma\"},\"hero\":{\"eyebrow\":\"Tüm sosyal medya hesaplarınız için yeni nesil\",\"headlinePrefix\":\"Link in bio değil,\",\"headlineStrike\":\"bak\",\"headlineSuffix\":\"artık \",\"sub\":\"Ziyaretçilerin linkine tıklayınca statik bir sayfa görmek yerine, işini tanıyan bir temsilciyle konuşsun. Kurulumu 10 dakika, kod yazmaya gerek yok.\",\"startFree\":\"Erken erişime başvur\",\"howItWorks\":\"Nasıl çalışır ↓\",\"note\":\"Sınırlı erken erişim · 10 dakikada yayında\"},\"statement\":{\"text\":\"Link in bio sizce de eskimedi mi? Web formundan kalma eski düzen ile mü lRow\":\"Haftalık Özet (Hap Şerit)\",\"closedLabel\":\"Kapalı\"},\"colorToolbar\":{\"label\":\"Renk:\",\"presetBrand\":\"Marka Turuncusu\",\"presetNavy\":\"Koyu Lacivert\",\"presetGreen\":\"Yeşil\",\"presetWhite\":\"Beyaz\",\"customColorTitle\":\"Özel renk\",\"applyBtn\":\"Uygula\",\"boldTitle\":\"Kalın\",\"underlineTitle\":\"Altı Çizili\",\"clearFormatTitle\":\"Biçimlendirmeyi Kaldır\",\"hint\":\"— metni seçip bir renge/biçime tıkla, kaldırmak için silgiye tıkla\"}},\"ChatWidget\":{\"welcome\":\"Merhaba! Ben {name}'ın asistanıyım. Size nasıl yardımcı olabilirim?\",\"assistantSuffix\":\"Asistanı\",\"online\":\"Çevrimiçi\",\"placeholder\":\"Bir mesaj yazın...\",\"defaultPreview\":\"Size nasıl yardımcı olabilirim?\",\"newChat\":\"Yeni sohbet\",\"signature\":\"Saule ile konuşuyorsunuz\",\"formName\":\"Adınız\",\"formContact\":\"Telefon veya e-posta\",\"formMessage\":\"Mesajınız (opsiyonel)\",\"formSubmit\":\"Gönder\",\"formSubmitting\":\"Gönderiliyor...\",\"formSuccess\":\"Mesajınız iletildi. İşletme sahibi en kısa sürede sizinle iletişime geçecek.\",\"formErrorGeneric\":\"Gönderilirken bir hata oluştu, lütfen tekrar deneyin.\"},\"Pricing\":{\"eyebrow\":\"Planlar\",\"title\":\"Şeffaf kapasite, şeffaf fiyat.\",\"intro\":\"Ödeme altyapımız yasal süreçlerle birlikte kuruluyor — şimdilik bir plan seçip bize ulaşın, ekibimiz sizinle birlikte kurulumu yapsın.\",\"perMonth\":\"/ay\",\"credits\":\"{count} kredi\",\"capacityExample\":\"≈ {saule} Saule sohbeti VEYA {beiwe} Beiwe güncellemesi\",\"extraPackName\":\"Ek Kredi Paketi\",\"extraPackNote\":\"Herhangi bir plana ek olarak satın alınabilir\",\"ctaButton\":\"Bu planı istiyorum\",\"formTitle\":\"Bize ulaşın\",\"formSubtitle\":\"Ödeme sağlayıcımız ve sözleşmelerimiz hazırlanıyor — bu süreçte kurulumu ekibimiz sizinle birlikte, elle yapıyor.\",\"formEmail\":\"E-posta\",\"formPhone\":\"Telefon\",\"formPlanLabel\":\"İlgilendiğiniz plan\",\"formPlanNone\":\"Henüz karar vermedim\",\"formMessage\":\"Eklemek istediğiniz bir not (opsiyonel)\",\"formSubmit\":\"Gönder\",\"formSubmitting\":\"Gönderiliyor...\",\"formSuccess\":\"Talebiniz alındı. Ekibimiz en kısa sürede sizinle iletişime geçecek.\",\"formErrorGeneric\":\"Gönderilirken bir hata oluştu, lütfen tekrar deneyin.\",\"footerNote\":\"Planlar\"},\"Stakeholders\":{\"title\":\"Paydaşlarımıza\",\"intro\":\"Bu sayfayı size — takım arkadaşlarıma, kullanıcılarımıza ve yatırımcılarımıza — talkinbio'nun ne olduğunu ve bu işi nasıl kurduğumuzu anlatmak için yazdım.\",\"eyebrow\":\"Manifesto · 2026\",\"ctaTitle\":\"Bio linkini şimdi çalıştır.\",\"ctaBody\":\"Kurulum 10 dakika sürüyor. İlk ayın sonunda veriye bakıp kararını sen verirsin.\",\"footerNote\":\"Manifesto\",\"q1\":{\"title\":\"Neden Şimdi\",\"content\":\"Sosyal medyada iş yapan bireysel hizmet sahipleri için son üç yılda bir şey değişti. DM'ler eskiden sadece içerik konuşulan bir yerdi; şimdi asıl satış oradan yapılıyor. Randevu, fiyat, pazarlık, karar — hepsi artık sosyal medya DM'sinden akıyor. Ve satıcılar bu trafiğin altında kalıyor.\\n\\nWhatsApp Business API'nin bireysel hesaplara açılması bu tabloyu daha da karmaşıklaştırdı: satıcı artık teknik olarak tüm kanallarında tek bir sesle konuşabilecek bir altyapıya erişebiliyor — ama bunu kuracak, yönetecek ve büyütecek bir araç yok.\\n\\nBu boşluğu büyük oyuncular ya görmedi ya da önemsemedi; hiçbiri bireysel hizmet sahipleri için tasarlamadı. Biz bu boşlukta çözüm üretiyoruz.\"},\"q2\":{\"title\":\"Hiçbir Şey Değişmezse\",\"content\":\"Bir müşteri soru soruyor. Cevap dört saat sonra geliyor. Müşteri çoktan başka birine gitmiş bile — satıcı bunun farkında bile değil.\\n\\nBu sahne her gün, 600.000 bireysel satıcının on binlercesinde tekrarlanıyor. Gelir kaybı görünmüyor çünkü kimse 'bir müşteri kaçırdım' demiyor; müşteri sessizce gidiyor, hiç sayılmıyor.\\n\\nYatırımcılar için biraz somutlaştıralım (Fermi modelimize dayanan bir tahmin): bir satıcı günde ortalama 10 DM alıyor, bunun yaklaşık %40'ı gerçek bir satın alma niyeti taşıyor. Cevap gecikmesi yüzünden bu 4 potansiyel müşteriden 2'si kayboluyor. Ortalama işlem değeri 800 TL olduğunda bu, tek bir satıcı için yılda yaklaşık 584.000 TL'lik bir kayıp demek. Pazarın tamamına yayınca hasarı hesaplamak bile zorlaşıyor.\"},\"q3\":{\"title\":\"Mevcut Alternatifler Neden Yetersiz\",\"content\":\"$9c\"},\"q4\":{\"title\":\"Ne Yapıyoruz\",\"content\":\"talkinbio iki parçadan oluşuyor.\\n\\nSaule, bio sayfanızda 7/24 çalışan yapay zeka asistanınız. Bir ziyaretçi soru sorduğunda Saule dinliyor, anlıyor ve hizmetinizi gerçekten bilen biri gibi cevap veriyor. Randevu topluyor, ilgilenen ziyaretçiyi kaydediyor, takip gerektiren durumları işaretliyor. Sabah kalktığınızda karşınızda kaçırılmış DM'ler değil, sıralanmış ve etiketlenmiş bir lead listesi buluyorsunuz.\\n\\nBeiwe ise bu konuşmaları analiz edip size haftalık pazarlama önerileri sunan ajan. 'Bu hafta en çok hangi soru soruldu? Hangi hizmet daha çok ilgi gördü? Ziyaretçiler hangi saatlerde geldi?' — Beiwe bu soruları yanıtlıyor, bir sonraki içerik kararınızı tahmine değil veriye dayandırmanızı sağlıyor.\\n\\nKurulum 10 dakika sürüyor, kod yazmanıza gerek yok. Sistem bir kere çalışmaya başladıktan sonra, siz çalışmasanız da o çalışmaya devam ediyor.\"},\"q5\":{\"title\":\"Farkımız\",\"content\":\"Her Saule konuşmasının altında küçük bir imza var: 'Saule ile konuşuyorsunuz — talkinbio.com.' Bunu satıcının sayfasını ziyaret eden herkes görüyor. Ve bazıları 'ben de kendi sayfamda bunu istiyorum' diyerek sisteme giriyor. Yani ürün kendi büyümesini kendisi sağlıyor — ücretli pazarlama yapmadan CAC organik kalabiliyor.\\n\\nBunun birkaç sonucu var. Birincisi viral döngü: her aktif asistan, yeni bir kullanıcı kazanma kanalına dönüşüyor.\\n\\nİkincisi konuşma verisi birikimi: Beiwe ne kadar çok kullanılırsa o kadar özelleşiyor. Yeni giren bir rakip bu veri avantajını bir günde kopyalayamaz; erken kullanıcılarımız bize stratejik bir veri zenginliği kazandırıyor.\\n\\nÜçüncüsü de Türkçe-ilk mimari: farklı dil ve ödeme altyapısına sahip pazarlara (MENA, LatAm) uyum sağlayacak lokalizasyon iskeletini şimdiden kuruyoruz. Yani v2 genişlemesi sıfırdan başlamak zorunda kalmayacak.\"},\"q6\":{\"title\":\"Gelir Modelimiz\",\"content\":\"Gelir modelimiz kredi bazlı bir abonelik. Faturalandırma altyapısı yol haritamızda lansman kapısının bir parçası; şu an, ilk pilotlarda tahsilatı elle yapıyoruz. Üç paketimiz var.\\n\\nStarter ($9/ay, 200 kredi) günde 3-5 DM alan ve ilk kez bir asistan kuran bireysel satıcı için. Bu kademedeki kullanıcı Saule'nin ne olduğunu öğreniyor, sistemin değerini test ediyor.\\n\\nPro ($29/ay, 700 kredi) haftada 30'dan fazla DM alan, düzenli bir müşteri kitlesi olan ve Beiwe analizini kullanan satıcı için — asıl gelir motorumuz burası.\\n\\nBusiness ($79/ay, 1.800 kredi) ise birden fazla hizmet hattı yürüten, yüksek hacimli DM trafiği yöneten ve otomasyon ihtiyacı olgunlaşmış satıcılar için.\\n\\nFiyatlarımız dolar üzerinden sabit; TL tahsilatını güncel kurdan yapıyoruz. Yıllık ödemede %20 indirim sunuyoruz — hem müşteriye tasarruf, hem bize kur riskine karşı bir tampon.\\n\\nRakamlara dökersek: efektif ARPU $15, LTV $300 (%5 churn varsayımıyla), hedeflediğimiz CAC ise $100'ün altı — viral imza döngümüz bunu organik tutacak.\"},\"q7\":{\"title\":\"Nereye Gidiyoruz\",\"content\":\"$9d\"},\"q8\":{\"title\":\"Nasıl Çalışıyoruz\",\"content\":\"Running Lean metodolojisini takip ediyoruz — bu bir slogan değil, çalışma biçimimizi doğrudan belirleyen bir çerçeve.\\n\\nÖnce problemi doğruluyoruz, sonra ürünü geliştiriyoruz. Müşteri görüşmelerini ürün geliştirmeden önce tamamlıyoruz; 20 görüşmede tekrar eden bir ağrı noktası netleşmezse sayıyı artırıyoruz.\\n\\nÜcretsiz deneme sunmuyoruz — bu bir tercih değil, metodolojik bir karar. Ash Maurya'nın Running Lean yaklaşımında bu net: ücretsiz erken erişim meraklı toplar, müşteri toplamaz. İlk 10 ödeyen kişi bizim için değer hipotezinin gerçek testi; ödeme, taahhüttür.\\n\\nSürekli Gelişim panelimiz var: Yalın Kanvas, Fermi Tahmini, Çekim Gücü Yol Haritası ve Yalın Satış Konuşması — şu an okuduğunuz bu sayfa dahil, hepsi canlı belgeler. Değiştikçe güncelliyoruz, güncelledikçe kaydediyoruz; versiyon disiplini bizim için bir standart.\\n\\nKanıt sınıflarını da açık tutuyoruz: doğrulanmış olanı doğrulanmış, doğrulanmamış olanı doğrulanmamış diye işaretliyoruz. Şişirilmiş kanıt iddiasına burada yer yok.\"},\"q9\":{\"title\":\"Sizden Ne İstiyoruz\",\"content\":\"Kullanıcılarımızdan: kurulum 10 dakika. Bio linkinizi talkinbio'ya bağlayın, bir ay boyunca Saule'nin kaç lead topladığını izleyin. Değer yaratmadıysa devam etmeyin. Yarattıysa, artık bunu biliyorsunuz.\\n\\nYatırımcılarımızdan: şu an erken evre, bootstrapped bir başlangıçtayız. Yatırım konuşması için doğru zaman $100K ARR'yi geçtiğimiz an; ama sizi o noktaya kadar bekletmek yerine, süreci şimdiden şeffaf tutmak istedik. Rakamlarımızı kanıt sınıfına göre işaretliyoruz — doğrulanmış olan doğrulanmış, tahmin olan tahmin. Hazır olduğumuzda size ulaşacağız.\\n\\nTakımımızdan: bu işi neden inşa ettiğimizi hatırlamak istediğinizde bu sayfaya dönün. Yaptığımız şeyin doğru olduğuna inanıyoruz; şimdi tek yapmamız gereken bunu kanıtlamak.\"}},\"Legal\":{\"eyebrow\":\"Hukuki Bilgilendirme\",\"title\":\"KVKK Aydınlatma Metni ve Gizlilik Politikası\",\"copy\":\"talkinbio olarak kişisel verilerinizin güvenliğini ve gizliliğini ciddiye alıyoruz. Bu sayfa, 6698 sayılı Kişisel Verilerin Korunması Kanunu kapsamında sizi bilgilendirmek amacıyla hazırlanmıştır.\",\"lastUpdated\":\"Son güncelleme: Temmuz 2026\",\"sections\":[{\"title\":\"1. Veri Sorumlusu\",\"body\":\"talkinbio, şirket kuruluşu tamamlanana kadar şahıs girişimi olarak yürütülmektedir; resmi veri sorumlusu kimliği (unvan, MERSİS/vergi numarası) kuruluş tamamlandığında bu sayfada güncellenecektir. Platform üzerinden toplanan kişisel veriler 6698 sayılı Kişisel Verilerin Korunması Kanunu'na (KVKK) uygun olarak işlenmektedir. İletişim: info@talkinbio.com\\n\\nÖnemli ayrım: talkinbio platformunu kullanan işletme sahipleri (müşterilerimiz), kendi ziyaretçilerinden/son müşterilerinden topladıkları veriler (ör. Saule ile yapılan konuşmalar, lead bilgileri) için KVKK anlamında veri sorumlusudur — talkinbio bu veriler için veri işleyen sıfatıyla hareket eder. Hesap sahibinin kendi verileri (ad, e-posta, hesap bilgileri) için ise veri sorumlusu talkinbio'dur.\"},{\"title\":\"2. İşlenen Kişisel Veriler\",\"body\":\"$9e\"},{\"title\":\"3. Kişisel Verilerin İşlenme Amaçları ve Hukuki Dayanakları\",\"body\":\"Kişisel verileriniz aşağıdaki amaçlarla ve hukuki dayanaklarla işlenmektedir:\\n\\n• Hesap oluşturma ve kimlik doğrulama → Sözleşmenin ifası (KVKK m.5/2-c)\\n• Platform hizmetlerinin sunulması (sayfa barındırma, Saule/Beiwe asistanları) → Sözleşmenin ifası (KVKK m.5/2-c)\\n• Yapay zeka destekli ziyaretçi iletişimi (Saule'nin soruları yanıtlaması, randevu/lead toplaması) → Sözleşmenin ifası + meşru menfaat (KVKK m.5/2-c, m.5/2-f)\\n• Güvenlik ve denetim kayıtları → Meşru menfaat (KVKK m.5/2-f)\\n• Ürün geliştirme, hata analizi ve kullanım ölçümü (kredi/token tüketimi) → Meşru menfaat (KVKK m.5/2-f)\\n• Yasal yükümlülüklerin yerine getirilmesi (fatura, muhasebe kayıtları) → Kanuni yükümlülük (KVKK m.5/2-ç)\\n• Ticari elektronik ileti gönderimi → Açık rıza (KVKK m.5/1) — Yalnızca rızanız bulunması halinde\"},{\"title\":\"4. Kişisel Verilerin Aktarımı\",\"body\":\"Kişisel verileriniz, hizmeti sağlayabilmek amacıyla aşağıdaki teknik altyapı sağlayıcılarına (veri işleyen sıfatıyla) aktarılmaktadır:\\n\\n• Supabase — veritabanı, kimlik doğrulama ve dosya depolama\\n• Vercel — uygulama barındırma (hosting)\\n• Anthropic — Saule ve Beiwe'nin yanıt üretmesini sağlayan yapay zeka modeli sağlayıcısı; bu kapsamda konuşma içerikleri Anthropic'e (Amerika Birleşik Devletleri merkezli) iletilir\\n• Resend — sistem ve bildirim e-postalarının gönderimi\\n\\nBu sağlayıcıların bir kısmı Avrupa Ekonomik Alanı veya Türkiye dışında yer almaktadır. Yurt dışına veri aktarımı söz konusu olduğunda KVKK'nın 9. maddesi kapsamındaki güvenceler (sağlayıcıların standart sözleşme hükümleri, güvenlik sertifikaları vb.) gözetilmektedir. Yasal zorunluluk halinde veriler yetkili kamu kurum ve kuruluşlarına da aktarılabilir.\"},{\"title\":\"5. Kişisel Verilerin Saklanma Süresi\",\"body\":\"Kişisel verileriniz aşağıdaki sürelerle saklanmaktadır:\\n\\n• Hesap ve platform verileri: hesabınız aktif olduğu sürece; hesap kapatıldıktan sonra 90 gün içinde silinir veya anonimleştirilir.\\n• Saule konuşma transkriptleri ve lead verileri: ilgili işletme hesabı aktif olduğu sürece saklanır (işletme sahibinin erişimine açık); hesap kapatıldıktan sonra 90 gün içinde silinir.\\n• Fatura ve muhasebe kayıtları: Vergi Usul Kanunu gereği 5 yıl saklanır.\\n• Güvenlik ve denetim logları: en fazla 12 ay saklanır.\\n\\nBir ziyaretçi kendisiyle ilgili konuşma kaydının silinmesini talep ederse, talep ilgili işletme sahibine (veri sorumlusuna) yönlendirilir; talkinbio veri işleyen sıfatıyla bu talebi teknik olarak yerine getirir.\"},{\"title\":\"6. KVKK Kapsamındaki Haklarınız\",\"body\":\"KVKK'nın 11. maddesi uyarınca aşağıdaki haklara sahipsiniz:\\n\\n• Kişisel verilerinizin işlenip işlenmediğini öğrenme\\n• İşlenmişse buna ilişkin bilgi talep etme\\n• İşlenme amacını ve amacına uygun kullanılıp kullanılmadığını öğrenme\\n• Yurt içinde veya yurt dışında aktarıldığı üçüncü kişileri bilme\\n• Eksik veya yanlış işlenmiş verilerin düzeltilmesini isteme\\n• KVKK'nın 7. maddesi çerçevesinde silinmesini veya yok edilmesini isteme\\n• Yapılan işlemlerin aktarılan üçüncü kişilere bildirilmesini isteme\\n• İşlenen verilerin münhasıran otomatik sistemler vasıtasıyla analiz edilmesi suretiyle aleyhinize bir sonucun ortaya çıkmasına itiraz etme\\n• Kanuna aykırı işleme nedeniyle zararın giderilmesini talep etme\\n\\nBu haklarınızı kullanmak için info@talkinbio.com adresine yazılı olarak başvurabilirsiniz.\"},{\"title\":\"7. Çerez Politikası\",\"body\":\"talkinbio platformu, oturum yönetimi ve güvenlik amacıyla yalnızca zorunlu çerez kullanmaktadır (ör. ziyaretçiyi kendi konuşma geçmişiyle eşleyen visitor_session_id çerezi ve oturum açma çerezleri). Şu an analitik veya pazarlama amaçlı çerez kullanılmamaktadır; bu değiştiğinde açık rıza almak üzere bir çerez bildirimi eklenecektir. Çerez tercihlerinizi tarayıcı ayarlarınızdan yönetebilirsiniz.\"},{\"title\":\"8. Gizlilik Politikası Değişiklikleri\",\"body\":\"talkinbio, bu metni gerektiğinde güncelleme hakkını saklı tutar. Önemli değişiklikler kayıtlı e-posta adresinize bildirilecektir. Güncel metne her zaman bu sayfadan ulaşabilirsiniz.\"},{\"title\":\"9. İletişim\",\"body\":\"KVKK kapsamındaki başvurularınız ve gizlilik ile ilgili tüm sorularınız için: info@talkinbio.com adresine e-posta gönderebilirsiniz.\"}],\"contactTitle\":\"Veri Sorumlusu İletişim\",\"contactBody\":\"talkinbio\\ninfo@talkinbio.com\\ntalkinbio Platformu — talkinbio.com\"},\"Login\":{\"loginTitle\":\"Talkinbio'ya Giriş Yap\",\"forgotTitle\":\"Şifremi Unuttum\",\"loginSubtitle\":\"İşletmenizi yönetmek için giriş yapın.\",\"forgotSubtitle\":\"E-posta adresinizi girin, size şifre sıfırlama bağlantısı gönderelim.\",\"resetLinkInvalid\":\"Şifre sıfırlama bağlantısı geçersiz veya süresi dolmuş. Lütfen yeni bir bağlantı isteyin.\",\"emailLabel\":\"E-posta Adresi\",\"emailPlaceholder\":\"ornek@sirket.com\",\"passwordLabel\":\"Şifre\",\"forgotPasswordLink\":\"Şifremi Unuttum\",\"rememberMe\":\"Beni Hatırla\",\"loginButton\":\"Giriş Yap\",\"loginButtonLoading\":\"Giriş Yapılıyor...\",\"sendLinkButton\":\"Bağlantıyı Gönder\",\"sendLinkButtonLoading\":\"Gönderiliyor...\",\"backToLogin\":\"Giriş ekranına dön\",\"invalidCredentials\":\"E-posta veya şifre hatalı\",\"resetLinkSent\":\"Şifre sıfırlama bağlantısı e-posta adresinize gönderildi. Lütfen kutunuzu kontrol edin.\",\"genericError\":\"Bir hata oluştu\"},\"AuthCallback\":{\"errorTitle\":\"Giriş Başarısız\",\"retryButton\":\"Tekrar Dene\",\"loadingTitle\":\"Giriş yapılıyor...\",\"loadingSubtit
